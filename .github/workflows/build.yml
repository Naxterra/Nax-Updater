name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build NaxUpdater.slnx -c Release
      - name: Test
        run: |
          dotnet run --project tests/NaxUpdater.Core.TransactionTests/NaxUpdater.Core.TransactionTests.csproj -c Release --no-build
          dotnet run --project tests/NaxUpdater.Core.SmokeTests/NaxUpdater.Core.SmokeTests.csproj -c Release --no-build
