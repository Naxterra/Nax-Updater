name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build release packages
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/package-release.ps1 -Version $version
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          if (gh release view $tag 2>$null) {
            gh release upload $tag artifacts/release/* --clobber
          }
          else {
            gh release create $tag artifacts/release/* --verify-tag --generate-notes --title "NaxUpdater $tag"
          }
